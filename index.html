<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App — Buscar ciudad</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Weather App</h1>
      <p>Busca una ciudad para conocer sus coordenadas.</p>

      <form id="city-search-form" novalidate aria-busy="false">
        <label for="city-query">Nombre de la ciudad</label>
        <p id="search-help">Escribe al menos 3 caracteres, sin contar espacios al inicio o al final.</p>
        <div class="search-controls">
          <input
            id="city-query"
            name="city"
            type="search"
            required
            aria-describedby="search-help search-status"
          >
          <button id="search-button" type="submit">Buscar</button>
        </div>
      </form>

      <p id="search-status" role="status" aria-live="polite" aria-atomic="true"></p>

      <section id="city-results" aria-labelledby="results-heading" hidden>
        <h2 id="results-heading">Resultados de la búsqueda</h2>
        <label for="city-select">Ciudad, región y país</label>
        <select id="city-select" aria-describedby="selected-city"></select>
        <p id="selected-city" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>

      <footer>
        <p>Datos de geocodificación de <a href="https://open-meteo.com/">Open-Meteo</a>.</p>
      </footer>
      <noscript>Activa JavaScript en el navegador para buscar ciudades.</noscript>
    </main>
  </body>
</html>
